<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open requests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6B5A}a:hover{color:#174F43}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #1F6B5A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; color: #18252B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #FFFFFF; padding: 22px 20px 14px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #E2E6DF">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 21px">Open requests</span>
        <span style="font-size: 12px; color: #5A676C">Near campus, from verified Penn students</span>
      </div>
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #F0B23A; display: grid; place-items: center; font-weight: 700; font-size: 14px" aria-label="Your profile">PS</span>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <button type="button" aria-pressed="true" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #1F6B5A; background: #E3F0EB; color: #174F43; font-size: 13px; font-weight: 600">All</button>
      <button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E2E6DF; background: #FFFFFF; color: #18252B; font-size: 13px; font-weight: 600">Dogs</button>
      <button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E2E6DF; background: #FFFFFF; color: #18252B; font-size: 13px; font-weight: 600">Cats</button>
      <button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E2E6DF; background: #FFFFFF; color: #18252B; font-size: 13px; font-weight: 600">This weekend</button>
      <button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E2E6DF; background: #FFFFFF; color: #18252B; font-size: 13px; font-weight: 600">Thanksgiving</button>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{requests}}" as="r" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #E2E6DF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; gap: 12px; align-items: center">
          <span style="flex: none; width: 52px; height: 52px; border-radius: 14px; background: {{r.tint}}; display: grid; place-items: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; color: #18252B">{{r.initial}}</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 700; font-size: 16px">{{r.pet}}</span>
            <span style="font-size: 13px; color: #5A676C">{{r.kind}}</span>
          </div>
          <span style="font-weight: 700; font-size: 15px">{{r.pay}}</span>
        </div>
        <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px 10px; font-size: 13px">
          <span style="color: #5A676C">When</span><span>{{r.when}}</span>
          <span style="color: #5A676C">Care</span><span>{{r.care}}</span>
          <span style="color: #5A676C">Where</span><span>{{r.where}}</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid #EEF0EB; padding-top: 12px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #3E4B50">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F6B5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            {{r.owner}}
          </span>
          <a href="Detail.dc.html" style="min-height: 40px; padding: 0 16px; border-radius: 10px; background: #1F6B5A; color: #FFFFFF; display: grid; place-items: center; font-size: 14px; font-weight: 700; text-decoration: none">View</a>
        </div>
      </div>
    </sc-for>
  </div>

  <nav style="background: #FFFFFF; border-top: 1px solid #E2E6DF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 8px 20px">
    <a href="Browse.dc.html" aria-current="page" style="min-height: 48px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #1F6B5A; text-decoration: none">Requests</a>
    <a href="Agreement.dc.html" style="min-height: 48px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #5A676C; text-decoration: none">Bookings</a>
    <a href="Main.dc.html" style="min-height: 48px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #5A676C; text-decoration: none">Post</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      requests: [
        { initial: 'M', tint: '#F0B23A', pet: 'Mochi', kind: 'Shiba Inu, 3 years', pay: '$20 a walk', when: 'Wed Nov 25 to Sun Nov 29', care: 'Walks twice a day, fresh water', where: 'Near 40th and Spruce', owner: 'Lu L., Wharton' },
        { initial: 'T', tint: '#BFD8CF', pet: 'Tofu', kind: 'Cat, shy with strangers', pay: '$15 a visit', when: 'Sat Nov 7 to Sun Nov 8', care: 'Feeding and litter, once a day', where: 'Graduate Hospital', owner: 'Esther L., Wharton' },
        { initial: 'B', tint: '#D9D3EA', pet: 'Biscuit', kind: 'Beagle mix, 6 years', pay: '$18 a walk', when: 'Weekdays Nov 9 to Nov 13', care: 'One evening walk', where: 'Near Clark Park', owner: 'Sam K., Penn Vet' }
      ]
    };
  }
}
</script>
</body>
</html>
